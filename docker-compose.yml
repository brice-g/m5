version: '3.8'

services:
  # --- BASE DE DONNÉES POSTGRESQL ---
  db:
    image: postgres:16-alpine
    container_name: fastia_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres_admin_prod}
      POSTGRES_PASSWORD: ${DB_PASS:-ChAnGeMe_ThIs_Is_SeCrEt_2026!}
      POSTGRES_DB: ${DB_NAME:-fastia_prod}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MLFLOW TRACKING & REGISTRY SERVER ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: fastia_mlflow_registry
    restart: always
    ports:
      - "${MLFLOW_PORT:-5001}:5001"
    volumes:
      - mlflow_backend_store:/mlflow/backend
      - mlflow_artifact_store:/mlflow/artifacts
    command: mlflow server --host 0.0.0.0 --port 5001 --backend-store-uri sqlite:////mlflow/backend/mlflow.db --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API FASTIA ENRICHIE ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastia-api:latest
    container_name: fastia_api_prod
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres_admin_prod}
      - DB_PASS=${DB_PASS:-ChAnGeMe_ThIs_Is_SeCrEt_2026!}
      - DB_NAME=${DB_NAME:-fastia_prod}
      - MLFLOW_TRACKING_URI=http://mlflow:5001
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_prod_data:
    driver: local
  mlflow_backend_store:
    driver: local
  mlflow_artifact_store:
    driver: local